{% extends "base.html" %}
{% block title %}Login — Admin Panel{% endblock %}
{% block anon %}
<div class="min-h-screen flex items-center justify-center p-4">
  <form method="post" class="card p-6 w-full max-w-sm space-y-4">
    <div class="text-center">
      <div class="text-2xl font-semibold">⚡ Admin Panel</div>
      <p class="text-xs text-slate-400 mt-1">Sign in with your panel ID &amp; password</p>
    </div>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="px-3 py-2 rounded-lg text-sm bg-red-900/40 text-red-200">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    <div><label class="text-xs text-slate-400">ID</label><input name="username" autofocus></div>
    <div><label class="text-xs text-slate-400">Password</label><input name="password" type="password"></div>
    <button class="btn w-full py-2">Login</button>
  </form>
</div>
{% endblock %}
