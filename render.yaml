services:
  - type: web
    name: nexus-store-telegram-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: godmadara01
      - key: OTP_BOT_TOKEN
        sync: false
      - key: OTP_ADMIN_ID
        sync: false
      - key: OTP_API_ID
        sync: false
      - key: OTP_API_HASH
        sync: false
      - key: OTP_SESSIONS_DIR
        value: sessions
      # ── Web Admin Panel login ───────────────────────────────
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASS
        sync: false
      - key: PANEL_SECRET
        generateValue: true
